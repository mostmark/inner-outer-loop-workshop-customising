<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="'Red Hat Text', Overpass, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d5258"/>
    </marker>
    <style>
      .repo { fill: #e7f1fa; stroke: #0066cc; stroke-width: 1.5; }
      .image { fill: #f3faf2; stroke: #3e8635; stroke-width: 1.5; }
      .cluster { fill: #fafafa; stroke: #4d5258; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .comp { fill: #fff; stroke: #4d5258; stroke-width: 1.5; }
      .head { font-weight: bold; font-size: 15px; fill: #151515; }
      .col { font-weight: bold; font-size: 16px; fill: #4d5258; }
      .small { font-size: 12.5px; fill: #383838; }
      .label { font-size: 12.5px; fill: #4d5258; font-style: italic; }
      .flow { stroke: #4d5258; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="col" x="20" y="24">GitHub</text>
  <text class="col" x="350" y="24">quay.io</text>
  <text class="col" x="640" y="24">OpenShift cluster</text>

  <!-- Repositories -->
  <rect class="repo" x="20" y="40" width="270" height="100" rx="6"/>
  <text class="head" x="34" y="64">gitops repository</text>
  <text class="small" x="34" y="86">Helm charts, bootstrap.sh, cleanup.sh,</text>
  <text class="small" x="34" y="104">smoke tests, tools/ (tooling image)</text>
  <text class="small" x="34" y="122">inner-outer-loop-workshop-gitops</text>

  <rect class="repo" x="20" y="185" width="270" height="90" rx="6"/>
  <text class="head" x="34" y="209">lab guide repository</text>
  <text class="small" x="34" y="231">Antora pages, theme, Containerfile</text>
  <text class="small" x="34" y="249">inner-outer-loop-workshop</text>

  <rect class="repo" x="20" y="325" width="270" height="100" rx="6"/>
  <text class="head" x="34" y="349">code repository</text>
  <text class="small" x="34" y="371">labs/ (services), .tasks/ (scripts),</text>
  <text class="small" x="34" y="389">devfile.yaml</text>
  <text class="small" x="34" y="407">inner-outer-loop-workshop-code</text>

  <!-- Images -->
  <rect class="image" x="345" y="96" width="215" height="76" rx="6"/>
  <text class="head" x="358" y="120">tooling image</text>
  <text class="small" x="358" y="140">workshop-tools:latest</text>
  <text class="label" x="358" y="160">built by tools/build-push.sh</text>

  <rect class="image" x="345" y="196" width="215" height="76" rx="6"/>
  <text class="head" x="358" y="220">lab guide image</text>
  <text class="small" x="358" y="240">inner-outer-loop-lab:latest</text>
  <text class="label" x="358" y="260">built by build-push-container.sh</text>

  <!-- Cluster -->
  <rect class="cluster" x="625" y="34" width="340" height="420" rx="10"/>

  <rect class="comp" x="645" y="50" width="300" height="72" rx="6"/>
  <text class="head" x="659" y="74">Argo CD (openshift-gitops)</text>
  <text class="small" x="659" y="96">installs operators, platform,</text>
  <text class="small" x="659" y="113">per-user resources, lab guide</text>

  <rect class="comp" x="645" y="198" width="300" height="68" rx="6"/>
  <text class="head" x="659" y="222">lab guide (namespace lab-guide)</text>
  <text class="small" x="659" y="244">one Deployment for all participants</text>

  <rect class="comp" x="645" y="312" width="300" height="122" rx="6"/>
  <text class="head" x="659" y="336">workspace per participant</text>
  <text class="small" x="659" y="358">Dev Spaces, namespace devspaces-&lt;user&gt;</text>
  <text class="small" x="659" y="378">tooling container + VS Code editor</text>
  <text class="small" x="659" y="398">code repository in /projects/workshop</text>
  <text class="small" x="659" y="418">devfile commands run .tasks/ scripts</text>

  <!-- Flows -->
  <path class="flow" d="M290,66 L643,66"/>
  <text class="label" x="400" y="58">Argo CD reads the charts</text>

  <path class="flow" d="M290,124 L343,128"/>

  <path class="flow" d="M560,140 C600,150 600,330 643,340"/>
  <text class="label" x="566" y="150">pulled</text>

  <path class="flow" d="M290,232 L343,232"/>

  <path class="flow" d="M560,232 L643,232"/>
  <text class="label" x="580" y="225">pulled</text>

  <path class="flow" d="M290,380 L643,380"/>
  <text class="label" x="330" y="372">cloned into every workspace (branch main)</text>
</svg>
