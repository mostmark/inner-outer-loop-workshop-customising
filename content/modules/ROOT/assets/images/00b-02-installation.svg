<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 330" width="1010" height="330" font-family="'Red Hat Text', Overpass, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d5258"/>
    </marker>
    <style>
      .step { fill: #e7f1fa; stroke: #0066cc; stroke-width: 1.5; }
      .wave { fill: #fff; stroke: #4d5258; stroke-width: 1.5; }
      .job { fill: #fdf7e7; stroke: #c58c00; stroke-width: 1.2; }
      .head { font-weight: bold; font-size: 14.5px; fill: #151515; }
      .small { font-size: 12.5px; fill: #383838; }
      .wavehead { font-weight: bold; font-size: 13px; fill: #0066cc; }
      .flow { stroke: #4d5258; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- bootstrap.sh -->
  <rect class="step" x="10" y="40" width="190" height="250" rx="6"/>
  <text class="head" x="22" y="64">bootstrap.sh</text>
  <text class="small" x="22" y="88">1. installs OpenShift GitOps</text>
  <text class="small" x="22" y="112">2. permissions and health</text>
  <text class="small" x="22" y="129">   check for openshift-gitops</text>
  <text class="small" x="22" y="153">3. Secrets that must not be</text>
  <text class="small" x="22" y="170">   in Git (user passwords)</text>
  <text class="small" x="22" y="194">4. creates the root</text>
  <text class="small" x="22" y="211">   Application</text>
  <text class="small" x="22" y="235">5. waits, then prints the</text>
  <text class="small" x="22" y="252">   lab guide URL template</text>

  <path class="flow" d="M200,165 L223,165"/>

  <!-- Root Application -->
  <rect class="step" x="225" y="110" width="150" height="110" rx="6"/>
  <text class="head" x="237" y="134">root Application</text>
  <text class="small" x="237" y="158">inner-outer-loop-</text>
  <text class="small" x="237" y="175">workshop</text>
  <text class="small" x="237" y="199">(charts/workshop)</text>

  <path class="flow" d="M375,165 L398,165"/>

  <!-- Wave 0 -->
  <rect class="wave" x="400" y="20" width="195" height="290" rx="6"/>
  <text class="wavehead" x="412" y="42">WAVE 0</text>
  <text class="head" x="412" y="66">workshop-operators</text>
  <text class="small" x="412" y="88">Subscriptions: Dev Spaces,</text>
  <text class="small" x="412" y="105">Pipelines, Service Mesh,</text>
  <text class="small" x="412" y="122">Kiali, Gitea operator</text>
  <rect class="job" x="412" y="134" width="171" height="26" rx="4"/>
  <text class="small" x="422" y="152">Job wait-for-operators</text>
  <text class="head" x="412" y="200">workshop-lab-guide</text>
  <text class="small" x="412" y="222">lab guide Deployment,</text>
  <text class="small" x="412" y="239">Route, URL template</text>

  <path class="flow" d="M595,165 L618,165"/>

  <!-- Wave 1 -->
  <rect class="wave" x="620" y="20" width="200" height="290" rx="6"/>
  <text class="wavehead" x="632" y="42">WAVE 1</text>
  <text class="head" x="632" y="66">workshop-platform</text>
  <text class="small" x="632" y="88">Dev Spaces, Istio, Kiali,</text>
  <text class="small" x="632" y="105">participant Argo CD, Gitea,</text>
  <text class="small" x="632" y="122">Nexus, DB templates,</text>
  <text class="small" x="632" y="139">user workload monitoring</text>
  <rect class="job" x="632" y="152" width="176" height="26" rx="4"/>
  <text class="small" x="642" y="170">Jobs: nexus-config, ...</text>
  <rect class="job" x="632" y="186" width="176" height="26" rx="4"/>
  <text class="small" x="642" y="204">Job wait-for-platform</text>
  <rect class="job" x="632" y="220" width="176" height="26" rx="4"/>
  <text class="small" x="642" y="238">Job maven-warmup</text>

  <path class="flow" d="M820,165 L843,165"/>

  <!-- Wave 2 -->
  <rect class="wave" x="845" y="20" width="160" height="290" rx="6"/>
  <text class="wavehead" x="857" y="42">WAVE 2</text>
  <text class="head" x="857" y="66">workshop-users</text>
  <text class="small" x="857" y="88">per participant:</text>
  <text class="small" x="857" y="105">projects, RBAC,</text>
  <text class="small" x="857" y="122">Argo CD AppProject,</text>
  <text class="small" x="857" y="139">workspace</text>
  <rect class="job" x="857" y="152" width="136" height="44" rx="4"/>
  <text class="small" x="867" y="170">Job user-setup</text>
  <text class="small" x="867" y="187">(Gitea, tokens)</text>
</svg>
