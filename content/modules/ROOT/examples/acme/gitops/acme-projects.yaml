{{- if .Values.acmeProjects.enabled }}
{{- $users := include "workshop.users" . | fromYamlArray -}}
{{- range $user := $users }}
---
# ACME: the participant's project for the chapter "Build a Container Image with Shipwright".
apiVersion: v1
kind: Namespace
metadata:
  name: {{ printf "acme-%s" $user | quote }}
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
    workshop.redhat.com/user: {{ $user | quote }}
  annotations:
    openshift.io/display-name: {{ printf "ACME - %s" $user | quote }}
    openshift.io/requester: {{ $user | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-admin" $user | quote }}
  namespace: {{ printf "acme-%s" $user | quote }}
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user | quote }}
{{- end }}
{{- end }}
